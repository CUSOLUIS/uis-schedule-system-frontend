name: Deploy Frontend

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, frontend-pi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias y build
        run: |
          npm install --silent
          npm run build --silent

      - name: Actualizar código en carpeta de despliegue
        working-directory: /home/dev/proyects/uis-schedule-system-frontend
        run: |
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}
          git clean -fd

      - name: Rebuild y reinicio del contenedor
        working-directory: /home/dev/proyects
        run: |
          docker-compose stop frontend
          docker-compose rm -f frontend
          docker-compose build --no-cache frontend
          docker-compose up -d --no-deps frontend

      - name: Limpieza post-deploy de Docker
        if: always()
        run: |
          echo "=== Limpieza post-deploy frontend ==="
          docker system prune -f
          docker builder prune -f --filter until=24h || docker buildx prune -f --filter until=24h || true
