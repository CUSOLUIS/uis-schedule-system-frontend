services:
  # Servicio de frontend Angular (Producción)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uis-schedule-frontend
    ports:
      - "80:80"
    restart: unless-stopped

  # Servicio de desarrollo (para trabajar con hot-reload)
  dev:
    image: node:20-alpine
    container_name: uis-schedule-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json"
    ports:
      - "4200:4200"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
    restart: unless-stopped
