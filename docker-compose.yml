version: '3.8'

services:
  # Servicio de frontend Angular
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uis-schedule-frontend
    ports:
      - "80:80"
    restart: unless-stopped

  # Servicio de desarrollo (para trabajar con hot-reload)
  dev:
    image: node:20-alpine
    container_name: uis-schedule-frontend-dev
    network_mode: host
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
    restart: unless-stopped
