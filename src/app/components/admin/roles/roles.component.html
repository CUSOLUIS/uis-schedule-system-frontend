<div class="roles-container">
  <app-section-header
    [config]="headerConfig"
    (createButtonClick)="toggleCreateForm()"
  ></app-section-header>

  <!-- Create User Form -->
  <div class="create-form-container" *ngIf="showCreateForm()">
    <div class="form-card">
      <div class="form-header">
        <h3><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h3>
        <button class="close-btn" (click)="toggleCreateForm()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form class="create-form" (ngSubmit)="createUser()">
        <div class="form-row">
          <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input
              type="text"
              id="username"
              [ngModel]="newUser().username"
              (ngModelChange)="setNewUserField('username', $event)"
              name="username"
              placeholder="juan.perez"
              required
            />
          </div>

          <div class="form-group">
            <label for="fullName">Nombre Completo</label>
            <input
              type="text"
              id="fullName"
              [ngModel]="newUser().fullName"
              (ngModelChange)="setNewUserField('fullName', $event)"
              name="fullName"
              placeholder="Juan Pérez"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              [ngModel]="newUser().email"
              (ngModelChange)="setNewUserField('email', $event)"
              name="email"
              placeholder="juan.perez@uis.edu.co"
              required
            />
          </div>

          <div class="form-group">
            <label for="role">Rol</label>
            <select
              id="role"
              [ngModel]="newUser().role"
              (ngModelChange)="setNewUserField('role', $event)"
              name="role"
            >
              <option value="student">Estudiante</option>
              <option value="teacher">Profesor</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="cancel-btn" (click)="toggleCreateForm()">
            Cancelar
          </button>
          <button type="submit" class="submit-btn">
            <i class="fas fa-save"></i>
            Crear Usuario
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="search-container">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        placeholder="Buscar usuarios por nombre, email o rol..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        class="search-input"
      />
    </div>
  </div>

  <!-- Users Table -->
  <div class="users-table-container">
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-users"></i> Lista de Usuarios</h3>
        <span class="user-count">{{ filteredUsers.length }} usuarios</span>
      </div>

      <div class="table-responsive">
        <table class="users-table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Nombre Completo</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Fecha Creación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers" class="user-row">
              <td class="user-info" data-label="Usuario">
                <div
                  class="user-avatar"
                  [style.background-color]="user.role.backgroundColor"
                >
                  <i class="fas fa-user"></i>
                </div>
                <span class="username">{{ user.username }}</span>
              </td>

              <td class="full-name" data-label="Nombre Completo">
                {{ user.fullName }}
              </td>

              <td class="email" data-label="Email">{{ user.email }}</td>

              <td class="role-cell" data-label="Rol">
                <select
                  class="role-select"
                  [value]="user.role.id"
                  (change)="onRoleChange(user.id, $event)"
                >
                  <option value="student">Estudiante</option>
                  <option value="teacher">Profesor</option>
                  <option value="admin">Administrador</option>
                </select>
              </td>

              <td class="created-date" data-label="Fecha Creación">
                {{ user.createdAt | date : "dd/MM/yyyy" }}
              </td>

              <td class="actions" data-label="Acciones">
                <button class="action-btn edit-btn" title="Editar Usuario">
                  <i class="fas fa-edit"></i>
                </button>
                <button
                  class="action-btn delete-btn"
                  title="Eliminar Usuario"
                  (click)="deleteUser(user.id)"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="table-footer" *ngIf="filteredUsers.length === 0">
        <div class="empty-state">
          <i class="fas fa-search"></i>
          <p>No se encontraron usuarios que coincidan con la búsqueda</p>
        </div>
      </div>
    </div>
  </div>
</div>
