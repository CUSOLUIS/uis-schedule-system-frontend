<div class="login-container">
  <div class="login-card">
    <!-- Logo UIS -->
    <div class="logo-section">
      <div class="logo-image">
        <img src="assets/images/logoUIS.png" alt="Logo UIS" class="uis-logo" />
      </div>
    </div>

    <!-- Formulario de Login -->
    <form class="login-form" (ngSubmit)="onSubmit()">
      <h2 class="login-title">Iniciar sesión en UIS Schedule</h2>

      <!-- Mensaje de error -->
      <div class="error-message" *ngIf="errorMessage">
        <i class="fas fa-exclamation-triangle"></i>
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          [disabled]="isLoading"
          required
          placeholder="Ingrese su usuario"
        />
      </div>

      <div class="form-group">
        <div class="password-header">
          <label for="password">Contraseña</label>
          <a routerLink="/recuperar-contrasena" class="forgot-password"
            >¿Olvidaste tu contraseña?</a
          >
        </div>
        <div class="password-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            [disabled]="isLoading"
            required
            placeholder="Ingresa tu contraseña"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleShowPassword()"
            [disabled]="isLoading"
          >
            <i
              class="fa"
              [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
      </div>

      <!-- Opción Recuérdame -->
      <div class="remember-me-group">
        <div class="checkbox-wrapper-46">
          <input
            type="checkbox"
            id="rememberMe"
            class="inp-cbx"
            name="rememberMe"
            [(ngModel)]="rememberMe"
            [disabled]="isLoading"
          />
          <label for="rememberMe" class="cbx">
            <span>
              <svg viewBox="0 0 12 10" height="10px" width="12px" aria-hidden="true">
                <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
              </svg>
            </span>
            <span class="remember-me-text">Recuérdame</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-signin" [disabled]="isLoading">
          <span *ngIf="!isLoading">Iniciar sesión</span>
          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i>
            Iniciando sesión...
          </span>
        </button>
      </div>

      <!-- Footer con Create Account -->
      <div class="login-footer">
        <span class="footer-text">¿Necesitas acceso al sistema?</span>
        <a routerLink="/recuperar-contrasena" class="create-account"
          >Recuperar contraseña</a
        >
      </div>

      <!-- Botón para mostrar credenciales de prueba (solo para desarrollo) -->
      <div class="test-credentials" *ngIf="!isLoading"></div>
    </form>
  </div>
</div>
