<div class="login-container">
  <div class="login-card">
    <div class="logo-container">
      <div class="logo-uis">
        <div class="logo-text">Universidad Industrial de Santander</div>
      </div>
      <div class="logo-image">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Logotipo_UIS.png"
          alt="Logo UIS"
        />
      </div>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <h2 class="login-title">Iniciar sesión</h2>

      <!-- Mensaje de error -->
      <div class="error-message" *ngIf="errorMessage">
        <i class="fas fa-exclamation-triangle"></i>
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            [disabled]="isLoading"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleShowPassword()"
            [disabled]="isLoading"
          >
            <i
              class="fa"
              [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-entrar" [disabled]="isLoading">
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i>
            Iniciando sesión...
          </span>
        </button>
      </div>

      <!-- Botón para mostrar credenciales de prueba (solo para desarrollo) -->
      <div class="test-credentials" *ngIf="!isLoading">
        <button type="button" class="btn-test" (click)="showTestCredentials()">
          Ver credenciales de prueba
        </button>
      </div>
    </form>
  </div>
</div>
