<div class="auth-page">
  <div class="auth-card">
    <h1>Recuperar contraseña</h1>
    <p class="subtitle">
      Ingresa tu correo institucional y te enviaremos un enlace para restablecer
      tu contraseña.
    </p>

    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="ejemplo@uis.edu.co"
        [disabled]="isLoading"
        required
      />

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Volver al inicio de sesión</a>
  </div>
</div>
