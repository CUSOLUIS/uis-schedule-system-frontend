<div class="auth-page">
  <div class="auth-card">
    <h1>Restablecer contraseña</h1>
    <p class="subtitle">Define una nueva contraseña para tu cuenta.</p>

    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <label for="newPassword">Nueva contraseña</label>
      <input
        id="newPassword"
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        [disabled]="isLoading"
        required
        minlength="8"
      />

      <label for="confirmPassword">Confirmar nueva contraseña</label>
      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        [disabled]="isLoading"
        required
        minlength="8"
      />

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Actualizando...' : 'Restablecer contraseña' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Volver al inicio de sesión</a>
  </div>
</div>
