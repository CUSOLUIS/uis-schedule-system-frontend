<div class="dashboard-container">
  <!-- Header de bienvenida -->
  <div class="welcome-section">
    <div class="welcome-card" [style.background]="getUserRoleGradient()">
      <div class="user-avatar">
        <i class="fas fa-user-circle"></i>
      </div>

      <h1 class="welcome-title">
        ¡Bienvenido, {{ currentUser()?.fullName || currentUser()?.username }}!
      </h1>

      <p class="welcome-subtitle">Sistema de Horarios UIS</p>

      <div class="role-info">
        <span class="role-badge">
          <i class="fas fa-id-badge"></i>
          {{ currentUser()?.role?.name }}
        </span>
      </div>
    </div>
  </div>

  <!-- Tarjetas de acciones rápidas -->
  <div class="quick-actions-section">
    <h2 class="section-title">Accesos Rápidos</h2>

    <div class="actions-grid">
      <div
        class="action-card"
        *ngFor="let item of getMenuItems()"
        [attr.data-role]="currentUser()?.role?.id"
      >
        <div class="card-icon" [style.color]="getUserRoleColor()">
          <i class="fas" [ngClass]="item.icon"></i>
        </div>
        <div class="card-content">
          <h3>{{ item.label }}</h3>
          <p>{{ item.description || "" }}</p>
        </div>
        <button
          class="card-button"
          (click)="navigateTo(item.route)"
          [style.background]="getUserRoleGradient()"
        >
          <i class="fas fa-arrow-right"></i>
          Ver
        </button>
      </div>
    </div>
  </div>

  <!-- Información del sistema -->
  <div class="system-info">
    <div class="info-card">
      <div class="info-content">
        <h4>Universidad Industrial de Santander</h4>
        <p>Sistema de Gestión de Horarios Académicos</p>
        <div class="version-info">
          <span class="version-badge">v0.0.1</span>
          <span class="status-badge active">Sistema Activo</span>
        </div>
      </div>
    </div>
  </div>
</div>
