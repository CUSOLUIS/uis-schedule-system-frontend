<!-- Botón hamburguesa para móvil -->
<button
  class="navbar-toggle"
  (click)="toggleNavbar()"
  [class.active]="!isCollapsed"
  *ngIf="currentUser()"
>
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
</button>

<!-- Overlay para cerrar menú en móvil -->
<div
  class="mobile-overlay"
  *ngIf="isMobile && !isCollapsed"
  (click)="toggleNavbar()"
></div>

<nav
  class="navbar"
  [class]="'navbar-' + (userRole()?.id || 'default')"
  [class.collapsed]="isCollapsed"
  [class.mobile]="isMobile"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <!-- Header del navbar -->
  <div class="navbar-header">
    <div class="user-info" *ngIf="currentUser()">
      <div
        class="user-avatar"
        [style.background-color]="userRole()?.backgroundColor"
      >
        <i class="fas fa-user"></i>
      </div>
      <div class="user-details">
        <span class="username">{{ currentUser()?.username }}</span>
        <span class="user-role">{{ userRole()?.name }}</span>
      </div>
    </div>
  </div>

  <!-- Menu items -->
  <div class="navbar-menu">
    <ul class="nav-list">
      <li
        class="nav-item"
        *ngFor="let item of menuItems(); trackBy: trackByRoute"
      >
        <a
          [routerLink]="item.route"
          class="nav-link"
          routerLinkActive="active"
          [class]="'nav-link-' + (userRole()?.id || 'default')"
          (click)="onNavigate()"
        >
          <i [class]="'fas ' + item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <!-- Logout button -->
    <div class="navbar-footer" *ngIf="currentUser()">
      <button
        class="logout-btn"
        (click)="logout()"
        [class]="'logout-btn-' + (userRole()?.id || 'default')"
      >
        <i class="fas fa-sign-out-alt"></i>
        <span class="nav-text">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</nav>
