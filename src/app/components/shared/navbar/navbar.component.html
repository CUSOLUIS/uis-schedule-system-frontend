<!-- Botón toggle para móvil (fuera del navbar) -->
<button
  class="navbar-toggle"
  [class.menu-open]="!isCollapsed"
  (click)="toggleNavbar()"
  *ngIf="isMobile"
  [style.background]="getUserRoleGradient()"
>
  <i
    class="fas"
    [class.fa-bars]="isCollapsed"
    [class.fa-times]="!isCollapsed"
  ></i>
</button>

<nav
  class="navbar"
  [class]="'navbar-' + (userRole()?.id || 'default')"
  [class.mobile]="isMobile"
  [class.collapsed]="isCollapsed"
  [class.hovered]="isHovered"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <!-- Header del navbar -->
  <div class="navbar-header">
    <div class="user-info" *ngIf="currentUser()">
      <div
        class="user-avatar"
        [style.background-color]="getUserRolePrimaryColor()"
      >
        <i class="fas fa-user"></i>
      </div>
      <div class="user-details">
        <span class="username">{{ currentUser()?.username }}</span>
      </div>
    </div>
  </div>

  <!-- Menu items -->
  <div class="navbar-menu" [class.collapsed]="isCollapsed">
    <ul class="nav-list">
      <li
        class="nav-item"
        *ngFor="let item of menuItems(); trackBy: trackByRoute"
      >
        <a
          [routerLink]="item.route"
          class="nav-link"
          routerLinkActive="active"
          [class]="'nav-link-' + (userRole()?.id || 'default')"
          (click)="onNavLinkClick()"
        >
          <i [class]="'fas ' + item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <!-- Logout button -->
    <div class="navbar-footer" *ngIf="currentUser()">
      <button
        class="logout-btn"
        (click)="logout(); onNavLinkClick()"
        [class]="'logout-btn-' + (userRole()?.id || 'default')"
      >
        <i class="fas fa-sign-out-alt"></i>
        <span class="nav-text">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</nav>
